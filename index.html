<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Configurateur FJ40</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #0c0c0d;
    --panneau: rgba(18, 18, 20, 0.86);
    --ligne: rgba(255, 255, 255, 0.09);
    --texte: #f2efe9;
    --doux: #9a968e;
    --accent: #c8a46a;
    --ambiance: radial-gradient(ellipse at 50% 45%, #2a2a2e 0%, #121214 55%, #08080a 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--fond); color: var(--texte); font-family: Manrope, system-ui, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  #scene { position: fixed; inset: 0 400px 0 0; background: var(--ambiance); transition: background .8s ease; }
  #scene canvas { display: block; width: 100%; height: 100%; outline: none; }

  header { position: fixed; top: 0; left: 0; right: 400px; padding: 28px 36px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 2; }
  header * { pointer-events: auto; }
  .titre small { display: block; font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .haut { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .haut a { color: var(--doux); text-decoration: none; transition: color .2s; white-space: nowrap; }
  .haut a:hover { color: var(--texte); }
  .langues { display: flex; gap: 2px; }
  .langues button { padding: 4px 7px; border-radius: 6px; color: var(--doux); font-size: 11px; letter-spacing: .14em; }
  .langues button:hover { color: var(--texte); }
  .langues button.actif { color: var(--accent); }
  .titre h1 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 46px; letter-spacing: .02em; line-height: 1; }
  .titre h1 em { font-style: italic; color: var(--accent); }
  .ambiances { display: flex; gap: 4px; background: rgba(0,0,0,.35); border: 1px solid var(--ligne); border-radius: 99px; padding: 4px; backdrop-filter: blur(10px); }
  .ambiances button { padding: 8px 14px; border-radius: 99px; font-size: 12px; color: var(--doux); transition: .25s; }
  .ambiances button.actif { background: var(--texte); color: #111; }

  .barre-vues { position: fixed; bottom: 28px; left: calc((100% - 400px) / 2); transform: translateX(-50%); display: flex; gap: 4px; background: rgba(0,0,0,.4); border: 1px solid var(--ligne); border-radius: 99px; padding: 4px; backdrop-filter: blur(10px); z-index: 2; }
  .barre-vues button { padding: 9px 16px; border-radius: 99px; font-size: 12px; color: var(--doux); transition: .25s; white-space: nowrap; }
  .barre-vues button:hover { color: var(--texte); }
  .barre-vues button.actif { color: var(--texte); background: rgba(255,255,255,.1); }

  #chargement { position: fixed; inset: 0 400px 0 0; display: grid; place-items: center; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--doux); z-index: 3; transition: opacity .6s; }
  #chargement.cache { opacity: 0; pointer-events: none; }
  #source { position: fixed; bottom: 84px; left: 36px; font-size: 11px; color: var(--doux); letter-spacing: .08em; z-index: 2; }

  aside { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; background: var(--panneau); border-left: 1px solid var(--ligne); display: flex; flex-direction: column; backdrop-filter: blur(20px); z-index: 4; }
  .options { flex: 1; overflow-y: auto; padding: 32px 30px 20px; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .groupe { padding: 22px 0; border-bottom: 1px solid var(--ligne); }
  .groupe:first-child { padding-top: 0; }
  .groupe h2 { font-size: 11px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--doux); margin-bottom: 14px; display: flex; justify-content: space-between; }
  .groupe h2 span { letter-spacing: .04em; text-transform: none; font-weight: 500; color: var(--texte); }

  .liste { display: flex; flex-direction: column; gap: 6px; }
  .choix { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 16px; border: 1px solid var(--ligne); border-radius: 12px; font-size: 14px; text-align: left; transition: .2s; }
  .choix:hover { border-color: rgba(255,255,255,.25); }
  .choix.actif { border-color: var(--accent); background: rgba(200,164,106,.08); }
  .choix .prix { font-size: 12px; color: var(--doux); white-space: nowrap; }
  .choix .case { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(255,255,255,.3); display: grid; place-items: center; flex-shrink: 0; font-size: 11px; }
  .choix.actif .case { background: var(--accent); border-color: var(--accent); color: #111; }
  .choix .gauche { display: flex; align-items: center; gap: 12px; }

  .pastilles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .pastille { aspect-ratio: 1; border-radius: 50%; position: relative; box-shadow: inset 0 -6px 12px rgba(0,0,0,.35), inset 0 4px 8px rgba(255,255,255,.18); transition: transform .2s; }
  .pastille:hover { transform: scale(1.06); }
  .pastille.actif::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid var(--accent); }
  .pastilles.petites { grid-template-columns: repeat(6, 1fr); }

  .pied { padding: 22px 30px 26px; border-top: 1px solid var(--ligne); background: rgba(10,10,11,.6); }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .total small { font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--doux); }
  .total strong { font-family: "Cormorant Garamond", serif; font-size: 36px; font-weight: 500; }
  .boutons { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .principal { background: var(--texte); color: #111; padding: 15px; border-radius: 12px; font-weight: 600; font-size: 14px; letter-spacing: .02em; transition: .2s; }
  .principal:hover { background: var(--accent); }
  .secondaire { border: 1px solid var(--ligne); padding: 0 16px; border-radius: 12px; font-size: 13px; }
  .secondaire:hover { border-color: rgba(255,255,255,.3); }

  #fenetre { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); display: none; place-items: center; z-index: 10; padding: 16px; }
  #fenetre.ouverte { display: grid; }
  .boite { background: #141416; border: 1px solid var(--ligne); border-radius: 18px; padding: 30px; width: min(460px, 100%); max-height: 90vh; overflow-y: auto; }
  .boite h3 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 30px; margin-bottom: 6px; }
  .boite p { color: var(--doux); font-size: 13px; margin-bottom: 18px; }
  .boite ul { list-style: none; font-size: 13px; margin-bottom: 20px; }
  .boite li { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--ligne); gap: 12px; }
  .boite li span:last-child { color: var(--doux); text-align: right; }
  .boite .boutons { grid-template-columns: 1fr 1fr; }
  .galerie { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .galerie button { aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; border: 1px solid var(--ligne); }
  .galerie img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .galerie button:hover img { transform: scale(1.06); }
  #visionneuse { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; place-items: center; z-index: 12; padding: 16px; cursor: zoom-out; }
  #visionneuse.ouverte { display: grid; }
  #visionneuse figure { max-width: min(900px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #visionneuse img { max-width: 100%; max-height: 80vh; border-radius: 12px; }
  #visionneuse figcaption { color: var(--texte); font-size: 14px; }
  #toast { position: fixed; bottom: 90px; left: calc((100% - 400px) / 2); transform: translate(-50%, 20px); background: var(--texte); color: #111; padding: 10px 18px; border-radius: 99px; font-size: 13px; opacity: 0; transition: .3s; z-index: 11; pointer-events: none; }
  #toast.visible { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 860px) {
    #scene, #chargement { inset: 0 0 52vh 0; }
    header { right: 0; padding: 16px; }
    .titre h1 { font-size: 30px; }
    .titre small { font-size: 9px; margin-bottom: 4px; }
    .haut { margin-bottom: 10px; gap: 12px; font-size: 10px; }
    .ambiances button { padding: 6px 10px; font-size: 11px; }
    #source { bottom: calc(52vh + 60px); left: 16px; }
    .barre-vues { left: 50%; bottom: calc(52vh + 12px); }
    .barre-vues button { padding: 7px 10px; font-size: 11px; }
    aside { top: auto; height: 52vh; width: 100%; border-left: 0; border-top: 1px solid var(--ligne); }
    .options { padding: 20px 16px 10px; }
    .pied { padding: 14px 16px 18px; }
    .total strong { font-size: 28px; }
    #toast { left: 50%; bottom: calc(52vh + 70px); }
  }
</style>
</head>
<body>

<div id="scene"></div>
<div id="chargement" data-t>Chargement du véhicule…</div>

<header>
  <div class="titre">
    <div class="haut">
      <a id="retour" href="#" hidden data-t>← Accueil</a>
      <div class="langues" id="langues"></div>
    </div>
    <small data-t>Configurateur</small>
    <h1>Land Cruiser <em>FJ40</em></h1>
  </div>
  <div class="ambiances" id="ambiances"></div>
</header>
<div id="source"></div>

<div class="barre-vues" id="vues"></div>

<aside>
  <div class="options" id="options"></div>
  <div class="pied">
    <div class="total"><small data-t>Prix total</small><strong id="total">—</strong></div>
    <div class="boutons">
      <button class="principal" id="devis" data-t>Demander un devis</button>
      <button class="secondaire" id="partager" title="Copier le lien de cette configuration" data-t>Partager</button>
    </div>
  </div>
</aside>

<div id="fenetre">
  <div class="boite">
    <h3 data-t>Votre FJ40</h3>
    <p data-t>Récapitulatif de votre configuration.</p>
    <ul id="recap"></ul>
    <div class="boutons">
      <button class="secondaire" id="fermer" style="padding:15px" data-t>Modifier</button>
      <button class="principal" id="envoyer" data-t>Envoyer la demande</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="visionneuse"><figure><img id="photo-grande" alt=""><figcaption id="photo-legende"></figcaption></figure></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>

function carteNormale(hauteur, taille = 1024, force = 6) {
  const h = new Float32Array(taille * taille);
  for (let y = 0; y < taille; y++) for (let x = 0; x < taille; x++) h[y * taille + x] = hauteur(x / taille, y / taille);
  const c = document.createElement('canvas'); c.width = c.height = taille;
  const g = c.getContext('2d'), img = g.createImageData(taille, taille);
  const at = (x, y) => h[((y + taille) % taille) * taille + ((x + taille) % taille)];
  for (let y = 0; y < taille; y++) for (let x = 0; x < taille; x++) {
    const dx = (at(x + 1, y) - at(x - 1, y)) * force, dy = (at(x, y + 1) - at(x, y - 1)) * force;
    const l = Math.hypot(dx, dy, 1), i = (y * taille + x) * 4;
    img.data[i] = (-dx / l * 0.5 + 0.5) * 255; img.data[i + 1] = (dy / l * 0.5 + 0.5) * 255;
    img.data[i + 2] = (1 / l * 0.5 + 0.5) * 255; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const bruit = (() => { const n = new Float32Array(256 * 256).map(() => Math.random());
  return (u, v) => { const x = Math.floor(u * 256) & 255, y = Math.floor(v * 256) & 255; return n[y * 256 + x]; }; })();
// grain du cuir : bruit lissé sur deux échelles
const grain = (u, v) => (bruit(u * 4, v * 4) * 0.6 + bruit(u * 8.3, v * 8.3) * 0.4) * 0.006;
const fract = x => x - Math.floor(x);
// fil de surpiqûre : petits segments le long d'une couture (d = distance à la couture, t = abscisse)
const fil = (d, t, pas) => Math.abs(d) < 0.006 && fract(t * pas) < 0.6;
const RELIEFS = {
  // cuir lisse : seulement le grain, aucune couture
  lisse: { repetition: 3, rugosite: 0.45, h: (u, v) => grain(u, v) * 1.5, fil: () => false },
  // losanges matelassés : couture creuse sur les diagonales, un rang de surpiqûre de chaque côté
  losange: { repetition: 3.5, rugosite: 0.5,
    h: (u, v) => {
      const n = 4, a = fract((u + v) * n), b = fract((u - v) * n);
      const coussin = Math.pow(Math.max(0, Math.sin(Math.PI * a) * Math.sin(Math.PI * b)), 0.3) * 0.3;
      return coussin - (fil_l(u, v) ? 0.02 : 0) + grain(u, v); },
    fil: (u, v) => fil_l(u, v) },
  // plis verticaux bombés, couture creuse entre deux plis, surpiqûre de chaque côté
  plisse: { repetition: 2.9, rugosite: 0.48,
    h: (u, v) => {
      const a = fract(u * 7);
      return Math.pow(Math.sin(Math.PI * a), 0.45) * 0.24 - (fil_p(u, v) ? 0.02 : 0) + grain(u, v); },
    fil: (u, v) => fil_p(u, v) },
};
function fil_l(u, v) {
  const n = 4, a = fract((u + v) * n), b = fract((u - v) * n);
  return fil(Math.min(a, 1 - a) - 0.05, b, 9) || fil(Math.min(b, 1 - b) - 0.05, a, 9);
}

  const c = document.createElement('canvas'); c.width = c.height = taille;
  const g = c.getContext('2d'), img = g.createImageData(taille, taille);
  for (let y = 0; y < taille; y++) for (let x = 0; x < taille; x++) {
    const i = (y * taille + x) * 4, f = estFil(x / taille, y / taille) ? 255 : 0;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = f; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
// Le fil a sa propre couleur : on la mélange à celle du cuir là où le masque est blanc
// (même coordonnées et même répétition que la carte de relief).
const uniformesFil = { masqueFil: { value: null }, couleurFil: { value: new THREE.Color('#e9dcc0') },
  couleurBord: { value: materiaux['Cuir bord'].color }, margePanneau: { value: 0.05 } };

function reliefCuir(id) {
  const r = RELIEFS[id];
  if (!cartesCuir[id]) cartesCuir[id] = { relief: carteNormale(r.h), fil: carteMasque(r.fil) };
  const t = cartesCuir[id].relief; t.repeat.set(r.repetition, r.repetition);
  uniformesFil.masqueFil.value = cartesCuir[id].fil;
  materiaux.Cuir.normalMap = t; materiaux.Cuir.normalScale.set(2.2, 2.2);
  materiaux.Cuir.roughness = r.rugosite; materiaux.Cuir.needsUpdate = true;
}

// Sièges : panneau central (couleur principale + motif + surpiqûres) et côtés lisses (couleur « côtés »),
// d'après la couleur de sommet « panneau » du modèle (distances aux bords, en mètres). Sans ce repère
// (contre-portes, console…), tout le cuir garde la couleur principale et le motif.
materiaux.Cuir.onBeforeCompile = shader => {
  Object.assign(shader.uniforms, uniformesFil);
  shader.vertexShader = 'attribute vec4 panneau;\nvarying vec4 vPanneau;\n' + shader.vertexShader.replace(
    '#include <begin_vertex>', '#include <begin_vertex>\n  vPanneau = panneau;');
  shader.fragmentShader = 'uniform sampler2D masqueFil;\nuniform vec3 couleurFil;\nuniform vec3 couleurBord;\nuniform float margePanneau;\nvarying vec4 vPanneau;\n' + shader.fragmentShader.replace(
    '#include <map_fragment>',
    `#include <map_fragment>
  float dPan = min(min(vPanneau.x, vPanneau.y), min(vPanneau.z, vPanneau.w));
  bool sansRepere = vPanneau.w > 0.5 && max(max(vPanneau.x, vPanneau.y), vPanneau.z) < 1e-4;
  float centrePan = sansRepere ? 1.0 : smoothstep(margePanneau - 0.0015, margePanneau + 0.0015, dPan);
  diffuseColor.rgb = mix(couleurBord, diffuseColor.rgb, centrePan);
#ifdef USE_NORMALMAP
  float fil = texture2D(masqueFil, vNormalMapUv).r * centrePan;
  diffuseColor.rgb = mix(diffuseColor.rgb, couleurFil, fil * 0.7);
#endif
  // couture le long du panneau (points espacés de 8 mm)
  if (!sansRepere) {
    float ligne = 1.0 - smoothstep(0.0006, 0.0016, abs(dPan - margePanneau + 0.006));
    float le_long = min(vPanneau.x, vPanneau.y) < min(vPanneau.z, vPanneau.w) ? vPanneau.z : vPanneau.x;
    float points = step(0.45, fract(le_long * 125.0));
    diffuseColor.rgb = mix(diffuseColor.rgb, couleurFil, ligne * points * 0.75);
  }`).replace(
    '#include <normal_fragment_maps>',
    'vec3 normalBase = normal;\n#include <normal_fragment_maps>\n  normal = normalize(mix(normalBase, normal, centrePan));');
};

// FJ40 PROVISOIRE (construit en code, remplacé par le vrai fichier dès qu'il existe)

function boite(l, h, p, mat, x, y, z, r = 0) {
  const geo = r ? new RoundedBoxGeometry(l, h, p, 3, r) : new THREE.BoxGeometry(l, h, p);
  const o = new THREE.Mesh(geo, mat); o.position.set(x, y, z); return o;
}
function cyl(rayon, long, mat, x, y, z, axe = 'x', seg = 32) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(rayon, rayon, long, seg), mat);
  if (axe === 'x') o.rotation.z = Math.PI / 2; if (axe === 'z') o.rotation.x = Math.PI / 2;
  o.position.set(x, y, z); return o;
}
function roue() {
  const g = new THREE.Group();
  const profil = [[0.2, -0.13], [0.32, -0.135], [0.365, -0.115], [0.385, -0.065], [0.388, 0], [0.385, 0.065], [0.365, 0.115], [0.32, 0.135], [0.2, 0.13]]
    .map(([r, y]) => new THREE.Vector2(r, y));
  const pneu = new THREE.Mesh(new THREE.LatheGeometry(profil, 48), m.pneu);
  g.add(pneu);
  // crampons
  for (let i = 0; i < 28; i++) {
    const a = (i / 28) * Math.PI * 2;
    const c = boite(0.05, 0.022, 0.07, m.pneu, Math.cos(a) * 0.384, 0, Math.sin(a) * 0.384);
    c.rotation.y = -a; c.position.y = (i % 2 ? 1 : -1) * 0.05;
    g.add(c);
  }
  const jante = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.2, 40), materiaux.Jantes); g.add(jante);
  const moyeu = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 0.05, 24), m.chrome); moyeu.position.y = 0.115; g.add(moyeu);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const trou = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.01, 16), m.noir);
    trou.position.set(Math.cos(a) * 0.15, 0.101, Math.sin(a) * 0.15); g.add(trou);
  }
  return g;
}

function construireFJ40() {
  const v = new THREE.Group();
  const C = materiaux.Carrosserie;

  // Caisse : profil latéral avec passages de roues, extrudé sur la largeur
  const W = 1.6, ar = -1.14, av = 1.14, ry = 0.42, rr = 0.49;
  const da = Math.asin((0.55 - ry) / rr), dx = Math.cos(da) * rr;
  const s = new THREE.Shape();
  s.moveTo(-1.86, 0.55);
  s.lineTo(ar - dx, 0.55);
  s.absarc(ar, ry, rr, Math.PI - da, da, true);
  s.lineTo(av - dx, 0.55);
  s.absarc(av, ry, rr, Math.PI - da, da, true);
  s.lineTo(1.72, 0.55);
  s.lineTo(1.72, 1.04);
  s.quadraticCurveTo(1.72, 1.08, 1.66, 1.08);
  s.lineTo(0.42, 1.08);
  s.lineTo(0.36, 1.18);
  s.lineTo(-1.86, 1.18);
  s.lineTo(-1.86, 0.55);
  const geo = new THREE.ExtrudeGeometry(s, { depth: W, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 4, curveSegments: 32 });
  geo.translate(0, 0, -W / 2);
  v.add(new THREE.Mesh(geo, C));

  // Capot légèrement bombé
  v.add(boite(1.26, 0.07, 1.12, C, 1.06, 1.1, 0, 0.03));
  // Lignes de portes et poignées
  for (const z of [-1, 1]) {
    const zz = z * (W / 2 + 0.033);
    for (const x of [0.33, -0.56]) v.add(boite(0.008, 0.58, 0.004, m.noir, x, 0.88, zz));
    v.add(boite(0.12, 0.025, 0.02, m.chrome, -0.44, 1.06, zz + z * 0.008));
    // clignotants avant
    v.add(boite(0.03, 0.06, 0.1, m.orange, 1.76, 0.98, z * 0.7));
    // feux arrière
    v.add(boite(0.03, 0.14, 0.09, m.rouge, -1.9, 0.86, z * 0.7));
    // rétroviseurs
    v.add(boite(0.03, 0.03, 0.12, m.noir, 0.42, 1.28, z * 0.86));
    v.add(boite(0.03, 0.12, 0.09, m.noir, 0.42, 1.36, z * 0.94, 0.01));
  }

  // Calandre + phares ronds
  v.add(boite(0.05, 0.42, 1.36, materiaux.Calandre, 1.75, 0.83, 0, 0.015));
  for (let i = -5; i <= 5; i++) v.add(boite(0.02, 0.28, 0.025, m.noir, 1.78, 0.8, i * 0.06));
  for (const z of [-0.52, 0.52]) {
    v.add(cyl(0.11, 0.05, m.chrome, 1.78, 0.86, z));
    v.add(cyl(0.09, 0.03, m.phare, 1.8, 0.86, z));
  }
  // Pare-chocs
  v.add(boite(0.12, 0.13, 1.8, m.chrome, 1.84, 0.52, 0, 0.02));
  v.add(boite(0.12, 0.13, 1.7, m.chrome, -1.93, 0.52, 0, 0.02));
  // Châssis et ponts
  v.add(boite(3.5, 0.18, 0.9, m.noir, 0, 0.47, 0));
  for (const x of [ar, av]) v.add(cyl(0.06, 1.4, m.noir, x, 0.38, 0, 'z', 16));

  // Pare-brise (incliné)
  const pb = new THREE.Group();
  pb.position.set(0.37, 1.18, 0); pb.rotation.z = 0.12;
  pb.add(boite(0.05, 0.05, 1.6, C, 0, 0.64, 0));
  pb.add(boite(0.05, 0.05, 1.6, C, 0, 0.025, 0));
  for (const z of [-0.78, 0.78]) pb.add(boite(0.05, 0.66, 0.05, C, 0, 0.33, z));
  pb.add(boite(0.01, 0.58, 1.5, m.vitre, 0, 0.33, 0));
  v.add(pb);

  // Variantes de toit (même noms que dans le fichier du modélisateur : toit_xxx)
  const rigide = new THREE.Group(); rigide.name = 'toit_rigide';
  rigide.add(boite(2.12, 0.66, 1.6, materiaux.Toit, -0.8, 1.51, 0, 0.06));
  for (const z of [-1, 1]) {
    const zz = z * 0.802;
    rigide.add(boite(0.62, 0.4, 0.006, m.vitre, -0.15, 1.53, zz));
    rigide.add(boite(0.9, 0.4, 0.006, m.vitre, -1.15, 1.53, zz));
  }
  rigide.add(boite(0.006, 0.38, 0.95, m.vitre, -1.862, 1.53, 0));
  v.add(rigide);

  const bache = new THREE.Group(); bache.name = 'toit_bache';
  const B = materiaux.Bache;
  bache.add(boite(2.1, 0.62, 1.6, B, -0.8, 1.5, 0, 0.11));
  // arceaux visibles sous la toile
  for (const x of [-1.62, -1.05, -0.48, 0.08]) bache.add(boite(0.05, 0.03, 1.5, B, x, 1.815, 0, 0.012));
  for (const z of [-1, 1]) {
    const zz = z * 0.803;
    bache.add(boite(0.56, 0.32, 0.006, m.vitre, -0.17, 1.55, zz, 0.002));
    bache.add(boite(0.8, 0.3, 0.006, m.vitre, -1.15, 1.55, zz, 0.002));
    // coutures
    bache.add(boite(2.0, 0.008, 0.004, m.noir, -0.8, 1.34, zz));
  }
  bache.add(boite(0.006, 0.3, 0.9, m.vitre, -1.853, 1.55, 0));
  v.add(bache);

  // Roues
  for (const x of [ar, av]) for (const z of [-0.74, 0.74]) {
    const r = roue(); r.rotation.x = z > 0 ? Math.PI / 2 : -Math.PI / 2;
    r.position.set(x, 0.39, z); v.add(r);
  }

  // ── Accessoires (même noms que dans le fichier du modélisateur : option_xxx)
  const galerie = new THREE.Group(); galerie.name = 'option_galerie';
  for (const z of [-0.72, 0.72]) galerie.add(cyl(0.02, 2.0, m.noir, -0.8, 1.98, z, 'x', 12));
  for (const x of [-1.75, -1.35, -0.95, -0.55, -0.15, 0.15]) galerie.add(cyl(0.018, 1.44, m.noir, x, 1.98, 0, 'z', 12));
  for (const x of [-1.7, 0.1]) for (const z of [-0.72, 0.72]) galerie.add(cyl(0.018, 0.14, m.noir, x, 1.9, z, 'y', 12));
  v.add(galerie);

  const fogs = new THREE.Group(); fogs.name = 'option_antibrouillards';
  for (const z of [-0.36, 0.36]) {
    fogs.add(cyl(0.065, 0.08, m.noir, 1.86, 0.66, z));
    fogs.add(cyl(0.055, 0.02, new THREE.MeshStandardMaterial({ color: 0xfff2b0, emissive: 0xffd76a, emissiveIntensity: 0.4 }), 1.9, 0.66, z));
  }
  v.add(fogs);

  const snorkel = new THREE.Group(); snorkel.name = 'option_snorkel';
  snorkel.add(cyl(0.045, 0.85, m.plastique, 0.48, 1.38, 0.86, 'y', 20));
  snorkel.add(boite(0.18, 0.1, 0.1, m.plastique, 0.54, 1.84, 0.86, 0.03));
  v.add(snorkel);

  const treuil = new THREE.Group(); treuil.name = 'option_treuil';
  treuil.add(cyl(0.08, 0.5, m.noir, 1.93, 0.55, 0, 'z', 20));
  treuil.add(boite(0.1, 0.12, 0.14, m.noir, 1.93, 0.55, 0.3, 0.02));
  treuil.add(boite(0.06, 0.06, 0.12, m.chrome, 1.98, 0.55, 0, 0.01));
  v.add(treuil);

  const secours = roue(); secours.name = 'option_roue_secours';
  secours.rotation.z = Math.PI / 2; secours.position.set(-2.06, 1.0, 0.25);
  v.add(secours);

  return v;
}

let vehicule, options = {}, sourceTexte = '';
const PREFIXES_VARIANTES = { toit_type: 'toit_', sieges: 'sieges_', jantes_type: 'jantes_' };
const variantes = { toit_type: {}, sieges: {}, jantes_type: {} };
let pneuFlanc = null;  // matériau du flanc des pneus + texture BFGoodrich
function installer(objet, source) {
  vehicule = objet;
  vehicule.traverse(o => {
    if (o.isMesh) {
      o.castShadow = o.receiveShadow = true;
      // Les matériaux du fichier qui portent un nom connu sont pilotés par le configurateur
      const remplacer = mat => materiaux[mat?.name] ?? mat;
      // repère « panneau » des sièges (couleur de sommet du modèle) : renommé pour le shader du cuir
      if (o.geometry.attributes.color && [].concat(o.material).some(m => m?.name === 'Cuir')) {
        o.geometry.setAttribute('panneau', o.geometry.attributes.color); o.geometry.deleteAttribute('color');
      }
      o.material = Array.isArray(o.material) ? o.material.map(remplacer) : remplacer(o.material);
    }
    // Feux : aspect verre brillant + légère lueur (veilleuses)
    if (o.isMesh) for (const m of [].concat(o.material)) if (m?.name === 'Pneu flanc' && !pneuFlanc) pneuFlanc = { m, map: m.map };
    if (o.isMesh) for (const m of [].concat(o.material)) if (m?.name === 'Feux' && !m.userData.regle) {
      m.roughness = 0.08; m.metalness = 0; m.envMapIntensity = 1.6;
      m.emissive = new THREE.Color(0xffffff); m.emissiveMap = m.map; m.emissiveIntensity = 0.35;
      m.userData.regle = true; m.needsUpdate = true;
    }
    if (o.name?.startsWith('option_')) options[o.name.slice(7)] = o;
    for (const [cle, pre] of Object.entries(PREFIXES_VARIANTES))
      if (o.name?.startsWith(pre)) { const id = o.name.slice(pre.length).split('__')[0]; (variantes[cle][id] ??= []).push(o); }
  });
  vehiculeCharge = true;
  for (const id of [...etat.accessoires]) if (!options[id]) etat.accessoires.delete(id);
  for (const cle of Object.keys(variantes))
    if (!variantes[cle][etat[cle]] && !('montre' in (trouver(cle) ?? {}))) etat[cle] = Object.keys(variantes[cle])[0] ?? etat[cle];
  construirePanneau();
  scene.add(vehicule);
  sourceTexte = source;
  document.getElementById('source').textContent = t(source);
  appliquer(true);
  document.getElementById('chargement').classList.add('cache');
}

const loader = new GLTFLoader();
const draco = new DRACOLoader(); draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);
loader.load(FICHIER_3D,
  gltf => {
    const obj = gltf.scene;
    // Recentrage automatique : roues posées au sol, véhicule centré
    // le hard top posé au sol ne compte pas dans le centrage du véhicule
    const sol = obj.getObjectByName('toit_hardtop_sol'), parentSol = sol?.parent;
    if (sol) parentSol.remove(sol);
    const b = new THREE.Box3().setFromObject(obj), c = b.getCenter(new THREE.Vector3());
    if (sol) parentSol.add(sol);
    obj.position.x -= c.x; obj.position.z -= c.z; obj.position.y -= b.min.y;
    installer(obj, '');
  },
  undefined,
  () => installer(construireFJ40(), 'Modèle provisoire — en attente du fichier 3D définitif')
);

// ─────────────────────────────────────────────────────────────
const cibles = {}; // couleurs vers lesquelles on fait un fondu
function viser(nom, hex, immediat) {
  const col = new THREE.Color(hex);
  if (immediat) materiaux[nom].color.copy(col);
  cibles[nom] = col;
}
function appliquer(immediat = false) {
  const carr = trouver('carrosserie'), coul = carr.hex;
  viser('Carrosserie', coul, immediat);
  for (const m of [materiaux.Carrosserie, materiaux.Toit]) {  // peinture métallisée : reflets plus marqués
    m.metalness = carr.metallise ? 0.55 : (m === materiaux.Toit ? 0.05 : 0);
    m.roughness = carr.metallise ? 0.3 : (m === materiaux.Toit ? 0.35 : 0.42);
  }
  viser('Toit', trouver('toit').hex ?? coul, immediat);  // par défaut : couleur de la carrosserie
  viser('Bache', trouver('bache').hex, immediat);
  for (const [cle, liste] of Object.entries(variantes)) {
    const c = trouver(cle), cibles = c && 'montre' in c ? c.montre : [etat[cle]];  // ex. « les deux » : soft top + hard top au sol
    for (const [id, objs] of Object.entries(liste)) for (const obj of objs) obj.visible = cibles.includes(id);
  }
  if (pneuFlanc) { pneuFlanc.m.map = etat.pneus === 'bfg' ? pneuFlanc.map : null; pneuFlanc.m.color.set(etat.pneus === 'bfg' ? 0xffffff : 0x0b0b0b); pneuFlanc.m.needsUpdate = true; }
  viser('Calandre', trouver('calandre').hex, immediat);
  viser('Amortisseurs', etat.equipements.has('ome') ? '#f2c318' : '#141414', immediat);
  const pc = trouver('pare_chocs');
  viser('Pare-chocs', pc.hex, immediat);
  materiaux['Pare-chocs'].metalness = pc.metal ? 1 : 0.3;
  materiaux['Pare-chocs'].roughness = pc.metal ? 0.06 : 0.45;
  viser('Cuir', trouver('cuir').hex, immediat);
  viser('Cuir bord', trouver('cuir_cotes').hex ?? trouver('cuir').hex, immediat);
  const f = trouver('fil');
  uniformesFil.couleurFil.value.set(f.hex ?? trouver('cuir').hex);
  if (!f.hex) uniformesFil.couleurFil.value.multiplyScalar(1.45);
  if (STYLE_CUIR_PRET) reliefCuir(etat.cuir_style);
  else { materiaux.Cuir.normalMap = null; materiaux.Cuir.needsUpdate = true; }
  const j = trouver('jantes');
  viser('Jantes', j.hex, immediat);
  materiaux.Jantes.metalness = j.metal ? 1 : 0.3;
  const chapeauNoir = j.id === 'noir';
  viser('Chapeau jantes', chapeauNoir ? '#161616' : '#ebebeb', immediat);
  materiaux['Chapeau jantes'].metalness = chapeauNoir ? 0.3 : 1;
  materiaux['Chapeau jantes'].roughness = chapeauNoir ? 0.6 : 0.07;
  materiaux.Jantes.roughness = j.metal ? 0.1 : (j.id === 'noir' ? 0.6 : 0.35);
  for (const [id, obj] of Object.entries(options)) obj.visible = etat.accessoires.has(id) && permis(trouver('accessoires', id) ?? {});

  let total = PRIX_DE_BASE;
  for (const cle of actifs()) total += trouver(cle).prix;
  for (const cle of CASES) for (const id of etat[cle]) { const c = trouver(cle, id); if (c && permis(c)) total += c.prix ?? 0; }
  const surDevis = CASES.some(cle => [...etat[cle]].some(id => trouver(cle, id)?.prix === null));
  document.getElementById('total').innerHTML = euros(total) +
    (surDevis ? '<small style="display:block;font:500 12px Manrope,sans-serif;color:var(--doux);text-align:right">' + t('+ options sur devis') + '</small>' : '');
  etat.total = total;

  const p = new URLSearchParams();
  for (const cle of CHOIX_UNIQUES) p.set(cle, etat[cle]);
  for (const cle of CASES) p.set(cle, [...etat[cle]].join(','));
  history.replaceState(null, '', '#' + p.toString());
}
const euros = n => n.toLocaleString(LOCALES[langue], { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const prixTxt = n => n == null ? t('Sur devis') : n ? '+ ' + euros(n) : t('Inclus');

function construirePanneau() {
  const zone = document.getElementById('options');
  zone.innerHTML = '';
  for (const [cle, g] of Object.entries(CATALOGUE)) {
    if (g.si && !g.si(etat)) continue;
    const liste_dispo = choixDispo(cle);
    if (liste_dispo.length === 0 || (cle in PREFIXES_VARIANTES && liste_dispo.length < 2)) continue;
    const bloc = document.createElement('section');
    bloc.className = 'groupe';
    const sel = g.type === 'cases' ? '' : t(trouver(cle).nom);
    bloc.innerHTML = `<h2>${t(g.titre)}<span>${g.type === 'couleur' ? sel + ' · ' + prixTxt(trouver(cle).prix) : ''}</span></h2>`;
    const liste = document.createElement('div');
    if (g.type === 'couleur') {
      liste.className = 'pastilles' + (g.petit ? ' petites' : '');
      for (const c of g.choix) {
        const b = document.createElement('button');
        b.className = 'pastille' + (etat[cle] === c.id ? ' actif' : '');
        const hex = c.hex ?? trouver(cle === 'fil' || cle === 'cuir_cotes' ? 'cuir' : 'carrosserie').hex;
        b.style.background = c.metal ? `linear-gradient(135deg, #fff, #8a8a8a 45%, #eee 60%, #777)` : hex;
        if (c.id === 'assorti') b.style.background = `linear-gradient(135deg, ${hex} 50%, #ecebe6 50%)`;
        b.title = `${t(c.nom)} — ${prixTxt(c.prix)}`;
        b.onclick = () => { etat[cle] = c.id; appliquer(); construirePanneau(); };
        liste.appendChild(b);
      }
    } else {
      liste.className = 'liste';
      for (const c of liste_dispo) {
        const actif = g.type === 'cases' ? etat[cle].has(c.id) : etat[cle] === c.id;
        const b = document.createElement('button');
        b.className = 'choix' + (actif ? ' actif' : '');
        b.innerHTML = g.type === 'cases'
          ? `<span class="gauche"><span class="case">${actif ? '✓' : ''}</span>${t(c.nom)}</span><span class="prix">${prixTxt(c.prix)}</span>`
          : `<span>${t(c.nom)}</span><span class="prix">${prixTxt(c.prix)}</span>`;
        b.onclick = () => {
          if (g.type === 'cases') etat[cle].has(c.id) ? etat[cle].delete(c.id) : etat[cle].add(c.id);
          else etat[cle] = c.id;
          appliquer(); construirePanneau();
        };
        liste.appendChild(b);
      }
    }
    bloc.appendChild(liste);
    zone.appendChild(bloc);
    if (cle === 'cuir_style') zone.appendChild(galerie());
  }
}
// Photos d'intérieurs réalisés (fournies par le propriétaire) : vignettes + agrandissement
const PHOTOS = [
  { src: 'photos/interieur-3.jpg', legende: 'Cuir caramel, losange et surpiqûres crème' },
  { src: 'photos/interieur-1.jpg', legende: 'Sièges individuels et console centrale' },
  { src: 'photos/interieur-4.jpg', legende: 'Cuir cognac vintage, losange' },
  { src: 'photos/interieur-2.jpg', legende: 'Banquettes arrière en cuir cognac' },
];
function galerie() {
  const bloc = document.createElement('section');
  bloc.className = 'groupe';
  bloc.innerHTML = `<h2>${t('Nos réalisations')}<span>${t('Photos réelles')}</span></h2>`;
  const grille = document.createElement('div'); grille.className = 'galerie';
  for (const p of PHOTOS) {
    const b = document.createElement('button');
    b.innerHTML = `<img src="${p.src}" alt="${t(p.legende)}" loading="lazy">`;
    b.onclick = () => { document.getElementById('photo-grande').src = p.src;
      document.getElementById('photo-legende').textContent = t(p.legende);
      document.getElementById('visionneuse').classList.add('ouverte'); };
    grille.appendChild(b);
  }
  bloc.appendChild(grille);
  return bloc;
}
construirePanneau();
document.getElementById('visionneuse').onclick = () => document.getElementById('visionneuse').classList.remove('ouverte');

// Ambiances
const zoneAmb = document.getElementById('ambiances');
function choisirAmbiance(id) {
  const a = AMBIANCES[id];
  conteneur.style.background = a.fond;
  soleil.color.set(a.soleil); soleil.intensity = a.force;
  scene.environmentIntensity = a.env;
  ombreSol.material.opacity = a.ombre;
  [...zoneAmb.children].forEach(b => b.classList.toggle('actif', b.dataset.id === id));
}
for (const [id, a] of Object.entries(AMBIANCES)) {
  const b = document.createElement('button'); b.textContent = t(a.nom); b.dataset.id = id; b.dataset.t = a.nom;
  b.onclick = () => choisirAmbiance(id); zoneAmb.appendChild(b);
}
choisirAmbiance('studio');

// Vues caméra
let animCamera = null;
const zoneVues = document.getElementById('vues');
for (const [id, v] of Object.entries(VUES)) {
  const b = document.createElement('button'); b.textContent = t(v.nom); b.dataset.t = v.nom;
  b.onclick = () => {
    controles.autoRotate = false;
    const vers = new THREE.Vector3(...v.pos);
    let cible = new THREE.Vector3(...(v.cible ?? CIBLE_EXT));
    // à l'intérieur, la cible est juste devant les yeux : tourner la souris = tourner la tête
    if (v.interieur) cible = vers.clone().add(cible.sub(vers).normalize().multiplyScalar(0.25));
    controles.minDistance = 0.05; controles.maxDistance = 12; controles.maxPolarAngle = Math.PI * 0.9;
    animCamera = { de: camera.position.clone(), vers, cibleDe: controles.target.clone(), cibleVers: cible, t: 0, interieur: !!v.interieur };
    [...zoneVues.children].forEach(x => x.classList.toggle('actif', x === b));
  };
  zoneVues.appendChild(b);
}
const bRot = document.createElement('button'); bRot.textContent = t('⟳ Rotation'); bRot.dataset.t = '⟳ Rotation';
bRot.onclick = () => { controles.autoRotate = !controles.autoRotate; animCamera = null; };
const bPlein = document.createElement('button'); bPlein.textContent = t('⤢ Plein écran'); bPlein.dataset.t = '⤢ Plein écran';
bPlein.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
zoneVues.append(bRot, bPlein);

// Devis et partage
const toast = t => { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('visible'); setTimeout(() => e.classList.remove('visible'), 2200); };
function lignes() {
  const l = [[t('Prix de base'), euros(PRIX_DE_BASE)]];
  for (const cle of actifs()) {
    const c = trouver(cle); l.push([t(CATALOGUE[cle].titre) + (langue === 'fr' ? ' : ' : ': ') + t(c.nom), prixTxt(c.prix)]);
  }
  for (const cle of CASES) for (const id of etat[cle]) { const c = trouver(cle, id); if (c && permis(c)) l.push([t(c.nom), prixTxt(c.prix)]); }
  l.push([t('Total'), euros(etat.total)]);
  return l;
}
document.getElementById('devis').onclick = () => {
  document.getElementById('recap').innerHTML = lignes().map(([a, b]) => `<li><span>${a}</span><span>${b}</span></li>`).join('');
  document.getElementById('fenetre').classList.add('ouverte');
};
document.getElementById('fermer').onclick = () => document.getElementById('fenetre').classList.remove('ouverte');
document.getElementById('envoyer').onclick = () => {
  document.getElementById('fenetre').classList.remove('ouverte');
  if (!LIEN_SITE) { toast(t('Demande prête — l’envoi sera branché sur le site')); return; }
  // Intégré au site : on ouvre le formulaire de contact du site, prérempli avec la configuration
  const texte = lignes().map(([a, b]) => `${a} — ${b}`).join('\n');
  try { localStorage.setItem('devis_configuration', texte); } catch {}
  allerAuSite('contact', texte);
};
// Retour vers le site. Si le site a ouvert le configurateur par-dessus sa propre page
// (version en ligne), c'est lui qui reprend la main ; sinon on change de page.
function allerAuSite(ancre, devis) {
  try { if (window.parent !== window && parent.retourDuConfigurateur) return parent.retourDuConfigurateur(ancre, devis, langue); } catch {}
  location.href = `${LIEN_SITE}?lang=${langue}` + (devis ? `&devis=${encodeURIComponent(devis)}` : '') + `#${ancre}`;
}
document.getElementById('retour').onclick = e => { e.preventDefault(); allerAuSite('configurateur'); };
document.getElementById('partager').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); toast(t('Lien de la configuration copié')); }
  catch { toast(t('Copiez l’adresse de la page pour partager')); }
};

// ─────────────────────────────────────────────────────────────
// LANGUE : sélecteur FR / EN / ES et mise à jour de tous les textes
// ─────────────────────────────────────────────────────────────
const zoneLangues = document.getElementById('langues');
for (const l of LANGUES) {
  const b = document.createElement('button'); b.textContent = l.toUpperCase(); b.dataset.l = l;
  b.onclick = () => { langue = l; try { localStorage.setItem('langue', l); } catch {} appliquerLangue(); };
  zoneLangues.appendChild(b);
}
if (LIEN_SITE) document.getElementById('retour').hidden = false;
function appliquerLangue() {
  document.documentElement.lang = langue;
  for (const e of document.querySelectorAll('[data-t]')) {
    if (!e.dataset.t) e.dataset.t = e.textContent;
    e.textContent = t(e.dataset.t);
  }
  const partager = document.getElementById('partager');
  partager.dataset.titre ??= partager.title;
  partager.title = t(partager.dataset.titre);
  if (LIEN_SITE) document.getElementById('retour').href = `${LIEN_SITE}?lang=${langue}#configurateur`;
  [...zoneLangues.children].forEach(b => b.classList.toggle('actif', b.dataset.l === langue));
  document.getElementById('source').textContent = t(sourceTexte);
  construirePanneau(); appliquer();
}
appliquerLangue();

// ─────────────────────────────────────────────────────────────
// BOUCLE D'AFFICHAGE
// ─────────────────────────────────────────────────────────────
function taille() {
  const w = conteneur.clientWidth, h = conteneur.clientHeight;
  rendu.setSize(w, h, false); camera.aspect = w / h;
  // élargit le champ de vision quand la zone est étroite, pour garder tout le véhicule
  camera.fov = THREE.MathUtils.clamp(30 * 1.5 / (w / h), 30, 55);
  camera.updateProjectionMatrix();
}
addEventListener('resize', taille); taille();


// Outil de diagnostic, actif seulement avec ?debug dans l'adresse
if (location.search.includes('debug')) window.__debug = { camera, controles, scene, materiaux, THREE, rendu, AMBIANCES, soleil };
const horloge = new THREE.Clock();
rendu.setAnimationLoop(() => {
  const dt = Math.min(horloge.getDelta(), 0.05);
  for (const [nom, col] of Object.entries(cibles)) materiaux[nom].color.lerp(col, 1 - Math.pow(0.002, dt));
  if (animCamera) {
    animCamera.t = Math.min(1, animCamera.t + dt / 1.1);
    const e = 1 - Math.pow(1 - animCamera.t, 3);
    camera.position.lerpVectors(animCamera.de, animCamera.vers, e);
    controles.target.lerpVectors(animCamera.cibleDe, animCamera.cibleVers, e);
    if (animCamera.t >= 1) { limitesCamera(animCamera.interieur); animCamera = null; }
  }
  controles.update();
  rendu.render(scene, camera);
});
</script>
</body>
